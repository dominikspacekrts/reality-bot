name: Kontrola bytů

# GitHub often delays or drops scheduled runs, so this fires every hour and the
# first step decides: run only if no check has happened since the last slot
# from config.json → schedule (Prague time). A missed slot is caught up within an hour.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Zkontrolovat hned, i když kontrola pro tento termín už proběhla'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kontrola
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Je čas kontroly?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          NOW=$(date +%s)
          # Latest slot (today or yesterday) that has already passed.
          SLOT=0
          for DAY in yesterday today; do
            for T in $(jq -r '.schedule[]' config.json); do
              S=$(TZ=Europe/Prague date -d "$DAY $T" +%s)
              if [ "$S" -le "$NOW" ] && [ "$S" -gt "$SLOT" ]; then SLOT=$S; fi
            done
          done
          LAST=$(gh api "repos/${{ github.repository }}/commits/state" --jq .commit.committer.date 2>/dev/null || echo "1970-01-01T00:00:00Z")
          LAST=$(date -d "$LAST" +%s)
          echo "Poslední kontrola: $(TZ=Europe/Prague date -d @$LAST '+%-d. %-m. %H:%M'), poslední termín: $(TZ=Europe/Prague date -d @$SLOT '+%-d. %-m. %H:%M')"
          if [ "$LAST" -lt "$SLOT" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "Kontrola pro tento termín už proběhla."; echo "run=false" >> "$GITHUB_OUTPUT"; fi

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # State (known listings, what was already notified) lives on the orphan branch "state".
      - name: Načíst stav
        run: |
          mkdir -p data
          git show origin/state:state.json > data/state.json 2>/dev/null || echo "Stav zatím neexistuje, začínám od nuly."

      - name: Zkontrolovat inzeráty
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node src/check.js

      - name: Uložit stav
        run: |
          DIR=$(mktemp -d)
          cp data/state.json "$DIR/"
          cd "$DIR"
          git init -q -b state
          git config user.name "reality-bot"
          git config user.email "reality-bot@users.noreply.github.com"
          git add state.json
          git commit -q -m "Stav po kontrole $(TZ=Europe/Prague date '+%-d. %-m. %Y %H:%M')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state

      # GitHub pauses scheduled workflows in repos without commits for 60 days.
      - name: Udržet plán aktivní
        run: |
          LAST=$(git log -1 --format=%ct origin/main)
          if [ $(( $(date +%s) - LAST )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "reality-bot"
            git config user.email "reality-bot@users.noreply.github.com"
            git commit -q --allow-empty -m "Udržení automatické kontroly"
            git push -q origin HEAD:main
          fi

      - name: Sestavit web
        run: node scripts/build-site.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
