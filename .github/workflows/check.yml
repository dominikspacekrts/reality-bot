name: Kontrola bytů

# Cron runs in UTC; these hours cover 8:00 and 19:00 in Prague in both winter and summer time.
# The first step lets through only the run that falls on 8 or 19 o'clock Prague time.
on:
  schedule:
    - cron: '0 6,7,17,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kontrola
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Je čas kontroly?
        id: gate
        run: |
          H=$(TZ=Europe/Prague date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" != "08" ] && [ "$H" != "19" ]; then
            echo "V Praze je $H h, tahle spuštění přeskakuji."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22

      # State (known listings, what was already notified) lives on the orphan branch "state".
      - name: Načíst stav
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p data
          git show origin/state:state.json > data/state.json 2>/dev/null || echo "Stav zatím neexistuje, začínám od nuly."

      - name: Zkontrolovat inzeráty
        if: steps.gate.outputs.run == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node src/check.js

      - name: Uložit stav
        if: steps.gate.outputs.run == 'true'
        run: |
          DIR=$(mktemp -d)
          cp data/state.json "$DIR/"
          cd "$DIR"
          git init -q -b state
          git config user.name "reality-bot"
          git config user.email "reality-bot@users.noreply.github.com"
          git add state.json
          git commit -q -m "Stav po kontrole $(TZ=Europe/Prague date '+%-d. %-m. %Y %H:%M')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state

      # GitHub pauses scheduled workflows in repos without commits for 60 days.
      - name: Udržet plán aktivní
        if: steps.gate.outputs.run == 'true'
        run: |
          LAST=$(git log -1 --format=%ct origin/main)
          if [ $(( $(date +%s) - LAST )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "reality-bot"
            git config user.email "reality-bot@users.noreply.github.com"
            git commit -q --allow-empty -m "Udržení automatické kontroly"
            git push -q origin HEAD:main
          fi

      - name: Sestavit web
        if: steps.gate.outputs.run == 'true'
        run: node scripts/build-site.js

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
        if: steps.gate.outputs.run == 'true'
